[options]
isa rv32i

[depth]
insn        10
reg      5  10
pc_fwd   5  10
pc_bwd   5  10
unique   1  5  10
causal   5  10
cover    1  30
[defines]
`define FORMAL
`define RISCV_FORMAL_ALIGNED_MEM

[verilog-files]
@basedir@/cores/@core@/wrapper.sv
@basedir@/cores/@core@/rv32i_cpu.sv
@basedir@/cores/@core@/rv32i_alu.sv
@basedir@/cores/@core@/regfile.sv
@basedir@/cores/@core@/decoder.sv
@basedir@/cores/@core@/control.sv

[cover]
always @* if (!reset) cover (channel[0].cnt_insns >= 2);
